<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="tab-signup" onclick="openTab('signup')">Реєстрація</button>
            <button class="tab-btn" id="tab-login" onclick="openTab('login')">Вхід</button>
        </div>

        <form id="signupForm" class="form-content active">
            <h2>Створити акаунт</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Ім'я</label>
                    <input type="text" name="firstName" placeholder="Марк">
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label>Прізвище</label>
                    <input type="text" name="lastName" placeholder="Отто">
                    <span class="error-msg"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@mail.com">
                <span class="error-msg"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Пароль</label>
                    <div class="pass-wrapper">
                        <input type="password" name="password" id="regPass" placeholder="••••••••">
                        <span class="toggle-pass" onclick="togglePass('regPass', this)">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="3" y1="3" x2="21" y2="21" stroke-width="2"></line>
                            </svg>
                        </span>
                    </div>
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label>Підтвердження</label>
                    <div class="pass-wrapper">
                        <input type="password" name="confirmPassword" id="confirmPass" placeholder="••••••••">
                        <span class="toggle-pass" onclick="togglePass('confirmPass', this)">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="3" y1="3" x2="21" y2="21" stroke-width="2"></line>
                            </svg>
                        </span>
                    </div>
                    <span class="error-msg"></span>
                </div>
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="text" name="phone" placeholder="+380XXXXXXXXX">
                <span class="error-msg"></span>
            </div>

            <div class="form-group">
                <label>Дата народження</label>
                <input type="date" name="birthDate">
                <span class="error-msg"></span>
            </div>

            <div class="form-group">
                <label>Стать</label>
                <select name="sex">
                    <option value="">Оберіть стать</option>
                    <option value="male">Чоловіча</option>
                    <option value="female">Жіноча</option>
                </select>
                <span class="error-msg"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Країна</label>
                    <select name="country" id="countrySelect">
                        <option value="">Оберіть країну</option>
                        <option value="Ukraine">Україна</option>
                        <option value="USA">США</option>
                    </select>
                    <span class="error-msg"></span>
                </div>
                <div class="form-group">
                    <label>Місто</label>
                    <select name="city" id="citySelect" disabled>
                        <option value="">Оберіть місто</option>
                    </select>
                    <span class="error-msg"></span>
                </div>
            </div>

            <button type="submit" class="submit-btn">Зареєструватися</button>
        </form>

        <form id="loginForm" class="form-content">
            <h2>Вхід в систему</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Введіть Username">
                <span class="error-msg"></span>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <div class="pass-wrapper">
                    <input type="password" name="loginPassword" id="loginPass" placeholder="••••••••">
                    <span class="toggle-pass" onclick="togglePass('loginPass', this)">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line x1="3" y1="3" x2="21" y2="21" stroke-width="2"></line>
                        </svg>
                    </span>
                </div>
                <span class="error-msg"></span>
            </div>
            <div class="form-group-check">
                <input type="checkbox" name="rememberMe" id="remember">
                <label for="remember">Запам'ятати мене</label>
            </div>
            <button type="submit" class="submit-btn">Увійти</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
